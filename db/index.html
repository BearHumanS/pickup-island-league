/* Layout: a broadcast-booth stat desk. Sticky scoreboard header, one wide column of panels, pixel display face only for numbers and labels. */
:root {
  --bg: #0b1020; --panel: #121a31; --panel2: #18223f; --line: #26304d; --fg: #eef0f6; --dim: #a3adc6; --faint: #6f7a96;
  --hot: #e8703a; --gold: #f2b630; --teal: #46d0c4; --bad: #e5534b; --good: #8be06a;
  --a5: #46d0c4; --a4: #8be06a; --a3: #f2b630; --a2: #f08a3c; --a1: #e5534b;
  --pixel: "Silkscreen", "Courier New", monospace; --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--gold); } a:hover { color: #ffd36b; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { font: 700 17px var(--pixel); color: var(--fg); text-decoration: none; letter-spacing: .03em; white-space: nowrap; }
.brand span { color: var(--hot); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto; }
nav.tabs a { color: var(--dim); text-decoration: none; padding: 6px 10px; font-size: 14px; border-bottom: 2px solid transparent; }
nav.tabs a.on { color: var(--fg); border-bottom-color: var(--hot); }
nav.tabs a:hover { color: var(--fg); }
.tools { display: flex; gap: 8px; align-items: center; }
.lang { display: flex; border: 1px solid var(--line); }
.lang button { background: none; border: 0; color: var(--dim); font: 500 12px var(--mono); padding: 6px 9px; cursor: pointer; }
.lang button.on { background: var(--panel2); color: var(--fg); }
.live { background: var(--hot); color: #10162a; text-decoration: none; font-weight: 700; font-size: 13px; padding: 7px 12px; white-space: nowrap; }
.live:hover { color: #10162a; background: #ff8a52; }
.status { display: flex; flex-wrap: wrap; gap: 6px 18px; padding-block: 8px; font: 500 12px var(--mono); color: var(--dim); border-top: 1px solid var(--line); }
.status b { color: var(--fg); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; background: #ff4a3d; margin-right: 6px; animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
@media (max-width: 600px) { header.top { position: static; } }
main { padding-block: 26px 60px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 700 clamp(26px, 4vw, 40px)/1.15 var(--pixel); letter-spacing: .01em; }
h2 { font: 700 18px/1.3 var(--pixel); letter-spacing: .03em; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--teal); margin: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; }
.panel > header a { font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 22px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 22px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,.045); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th.l, td.l { text-align: left; }
tbody tr:hover td { background: rgba(255,255,255,.03); }
tr.link { cursor: pointer; }
td.num, .num { font-family: var(--mono); }
td .tn { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); text-decoration: none; }
td .tn:hover { color: var(--gold); }
img.lg { width: 26px; height: 26px; image-rendering: pixelated; flex: none; }
img.lg.big { width: 72px; height: 72px; }
.ovr { font: 700 14px var(--mono); }
.t-elite { color: #c58bff; } .t-gold { color: var(--gold); } .t-silver { color: #c9d1db; } .t-bronze { color: #c98a52; }
.pill { display: inline-block; font: 600 10px var(--mono); letter-spacing: .06em; padding: 1px 6px; border: 1px solid currentColor; vertical-align: 1px; }
.pill.inj { color: var(--bad); } .pill.fa { color: var(--teal); } .pill.rk { color: var(--gold); } .pill.fan { color: #c58bff; } .pill.big { color: #10162a; background: var(--gold); border-color: var(--gold); }
.w { color: var(--good); } .lo { color: var(--bad); } .dim { color: var(--dim); } .faint { color: var(--faint); }
.empty { color: var(--dim); padding: 30px 0; text-align: center; }
/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.bigm { position: relative; overflow: hidden; background: linear-gradient(100deg, var(--ca) 0 50%, var(--cb) 50% 100%); padding: 0; border: 0; }
.bigm .in { flex: 1; background: rgba(11,16,32,.8); margin: 0; padding: 20px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; }
.vs .side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vs .side b { font: 700 clamp(18px, 3vw, 26px) var(--pixel); }
.vs .side span { font-size: 13px; color: var(--dim); }
.vs .x { font: 700 22px var(--pixel); color: var(--gold); }
.eta { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; font: 500 13px var(--mono); color: var(--dim); }
.eta b { color: var(--fg); }
.games { display: grid; gap: 6px; }
.game { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel2); font-size: 14px; }
.game .a { display: flex; align-items: center; gap: 8px; min-width: 0; } .game .a.r { justify-content: flex-end; text-align: right; }
.game .a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.game .sc { font: 600 14px var(--mono); min-width: 70px; text-align: center; color: var(--dim); }
.game .sc.done { color: var(--fg); }
.news { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; color: var(--dim); }
.news li { padding-left: 14px; border-left: 2px solid var(--line); }
.cmds { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.cmd { background: var(--panel2); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.cmd code { font: 600 14px var(--mono); color: var(--gold); }
.cmd span { font-size: 13px; color: var(--dim); }
/* team page */
.thead { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 22px 20px; background: linear-gradient(100deg, var(--tc) 0%, var(--panel) 70%); border: 1px solid var(--line); }
.thead .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.thead .meta span { color: var(--fg); opacity: .85; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--faint); } .kv dd { margin: 0; }
.cap { height: 10px; background: var(--panel2); position: relative; }
.cap i { position: absolute; inset: 0 auto 0 0; background: var(--teal); }
.cap i.over { background: var(--bad); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.tcard { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--tc); color: var(--fg); text-decoration: none; }
.tcard:hover { background: var(--panel2); color: var(--fg); }
.tcard b { display: block; } .tcard span { font-size: 13px; color: var(--dim); }

.pcard { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 22px; }
@media (max-width: 860px) { .pcard { grid-template-columns: 1fr; } }
.face { background: linear-gradient(160deg, var(--tc) 0%, var(--panel) 62%); border: 2px solid var(--tier); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.face .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.face .o { font: 700 56px/1 var(--pixel); }
.face .o small { display: block; font-size: 12px; letter-spacing: .1em; color: var(--dim); }
.face .tier { font: 700 11px var(--mono); letter-spacing: .12em; color: #10162a; background: var(--tier); padding: 2px 8px; align-self: flex-start; }
.face h1 { font-size: clamp(24px, 4vw, 32px); }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.barr { display: grid; grid-template-columns: 44px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; }
.barr i { height: 6px; background: var(--panel2); position: relative; }
.barr i b { position: absolute; inset: 0 auto 0 0; }
.barr em { font: 600 13px var(--mono); font-style: normal; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12px; padding: 2px 8px; background: rgba(0,0,0,.28); border: 1px solid var(--line); }
.arch { margin: 8px 0 0; font-weight: 700; color: var(--gold); font-size: 14px; }
.attrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.ag { background: var(--panel2); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.ag h3 { display: flex; justify-content: space-between; font: 700 13px var(--pixel); letter-spacing: .03em; padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.ar { display: grid; grid-template-columns: 1fr 70px 30px; gap: 8px; align-items: center; font-size: 13px; }
.ar i { height: 5px; background: var(--bg); position: relative; } .ar i b { position: absolute; inset: 0 auto 0 0; }
.ar em { font: 600 13px var(--mono); font-style: normal; text-align: right; }
.c5 { color: var(--a5); } .c4 { color: var(--a4); } .c3 { color: var(--a3); } .c2 { color: var(--a2); } .c1 { color: var(--a1); }
.b5 { background: var(--a5); } .b4 { background: var(--a4); } .b3 { background: var(--a3); } .b2 { background: var(--a2); } .b1 { background: var(--a1); }
.statline { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 8px; }
.statline div { background: var(--panel2); padding: 10px; text-align: center; }
.statline b { display: block; font: 600 20px var(--mono); }
.statline span { font: 500 11px var(--mono); letter-spacing: .08em; color: var(--faint); }
/* controls */
.filters { display: flex; flex-wrap: wrap; gap: 10px; }
.filters input, .filters select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); padding: 8px 10px; font: 14px var(--body); min-width: 0; }
.filters input { flex: 1 1 220px; }
.more { align-self: center; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); padding: 8px 16px; cursor: pointer; font: 14px var(--body); }
.more:hover { border-color: var(--gold); }
.lead { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.045); font-size: 14px; }
.lead .r { font: 600 12px var(--mono); color: var(--faint); }
.lead a { color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .lead a:hover { color: var(--gold); }
.lead b { font: 600 14px var(--mono); }
.lead small { color: var(--faint); margin-left: 6px; }
abbr[data-tip] { text-decoration: none; border-bottom: 1px dotted currentColor; cursor: help; }
.ar abbr[data-tip], .barr abbr[data-tip], .ag h3 abbr[data-tip], .kv abbr[data-tip] { border-bottom-color: rgba(238,240,246,.2); }
abbr[data-tip]:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
#tip { position: fixed; z-index: 50; max-width: min(280px, calc(100vw - 24px)); background: #f4f1e6; color: #10162a; font: 500 13px/1.45 var(--body); letter-spacing: 0; text-transform: none; padding: 8px 11px; box-shadow: 0 8px 22px rgba(0,0,0,.45); pointer-events: none; }
#tip b { display: block; font: 700 12px var(--mono); margin-bottom: 2px; }
footer { border-top: 1px solid var(--line); padding-block: 24px; color: var(--faint); font-size: 13px; }
.loading { padding: 80px 0; text-align: center; color: var(--dim); font: 500 14px var(--mono); }
</style>
</head>

      ${chips.length ? `<div class="chips">${chips.map(c => `<span>${esc(c)}</span>`).join('')}</div>` : ''}
      <div class="bars">${D.rnames.map(bar).join('')}</div>
      <dl class="kv"><dt>${abD(t.style, GL[ST.lang].STYLE)}</dt><dd>${abD(p.play || '-', dsc.play[p.play])}</dd><dt>${abD(t.pers, GL[ST.lang].PERS)}</dt><dd>${abD(p.pers || '-', dsc.pers[p.pers])}</dd>${p.pa ? `<dt>${abD(t.persona, GL[ST.lang].PERSONA)}</dt><dd>${abD(p.pa, dsc.pa[p.pa])}</dd>` : ''}${p.rel ? `<dt>${esc(t.rel)}</dt><dd>${abD(String(p.rel), ST.lang === 'ko' ? '슛을 얼마나 빨리 놓나. 빠를수록 블록당하기 어려워요.' : 'How quickly he gets the shot off. Faster is harder to block.')} · ${p.hand === 'L' ? t.lefty : t.righty}</dd>` : ''}<dt>${abA(t.dur, 'dur')}</dt><dd>${abD(String(p.dur ?? '-'), durTxt(p.dur), t.dur)}</dd><dt>${abD(t.contract, GL[ST.lang].CONTRACT)}</dt><dd>${p.sal ? abD(`${money(p.sal)} × ${p.yrs}${t.yrs}`, conTxt(p), t.contract) : p.dem ? abD(`${t.demand} ${money(p.dem)}`, GL[ST.lang].DEMAND, t.demand) : '-'}</dd>${p.sig && p.sig.length ? `<dt>${abD(t.sigs, GL[ST.lang].SIGS)}</dt><dd>${p.sig.map(n => abD(n, dsc.sig[n])).join(' · ')}</dd>` : ''}${(p.aw && p.aw.length) || p.ring ? `<dt>${t.awards}</dt><dd>${[...(p.ring ? [abD(`${t.ring}${p.ring > 1 ? ' ×' + p.ring : ''}`, AWD[ST.lang].RING, t.ring)] : []), ...(p.aw || []).map(([k, v]) => awTip(k, v))].join(' · ')}</dd>` : ''}</dl></div>`;
    const groups = D.cats.map(([c, cn]) => { const rows = D.attrs.map((a, i) => [a, p.a[i]]).filter(([a]) => a[1] === c);
      return `<div class="ag"><h3><span>${abA(cn, c)}</span><span class="c${ac(p.r[c])}">${p.r[c]}</span></h3>${rows.map(([a, v]) => `<div class="ar"><span>${abA(a[2], a[0])}</span><i><b class="b${ac(v)}" style="width:${v}%"></b></i><em class="c${ac(v)}">${v}</em></div>`).join('')}</div>`; }).join('');
    const line = g ? [[f1(s.pts / g), 'PTS'], [f1(s.reb / g), 'REB'], [f1(s.ast / g), 'AST'], [f1(s.stl / g), 'STL'], [f1(s.blk / g), 'BLK'], [f1(s.tov / g), 'TOV'], [pct(s.fgm, s.fga), 'FG%'], [pct(s.tpm, s.tpa), '3P%'], [pct(s.ftm, s.fta), 'FT%'], [f1(s.min / 60 / g), 'MIN'], [g, 'GP']] : null;
    const hi = p.hi ? Object.entries(p.hi).map(([k, v]) => `<div><b>${v}</b><span>${ab(k.toUpperCase())}</span></div>`).join('') : '';
    const cr = p.cr && p.cr.gp ? `<div class="statline"><div><b>${p.cr.seasons || 0}</b><span>${ab('SEASONS')}</span></div><div><b>${p.cr.gp}</b><span>${ab('GP')}</span></div><div><b>${p.cr.pts}</b><span>${ab('PTS')}</span></div><div><b>${f1(p.cr.pts / p.cr.gp)}</b><span>${ab('PPG')}</span></div></div>` : '';
    return `<div class="pcard">${face}<div style="display:flex;flex-direction:column;gap:22px;min-width:0">
      ${panel(t.attrs, `<div class="attrs">${groups}</div>`)}
      ${p.tn && D.tend ? panel(t.tend, `<p class="dim" style="margin:-4px 0 10px;font-size:13px">${esc(t.tendNote)}</p><div class="attrs">${tendGroups(p)}</div>`) : ''}
      ${panel(`${t.stats} · ${t.perGame}`, line ? `<div class="statline">${line.map(([v, k]) => `<div><b>${v}</b><span>${ab(k)}</span></div>`).join('')}</div>` : `<p class="empty">${t.noData}</p>`)}
      ${hi ? panel(t.highs, `<div class="statline">${hi}</div>`) : ''}${cr ? panel(t.career, cr) : ''}</div></div>`;
  }
  function vLeaders() {
    const t = T(), cats = [['pts', 'PTS'], ['reb', 'REB'], ['ast', 'AST'], ['stl', 'STL'], ['blk', 'BLK'], ['tpm', '3PM'], ['fg', 'FG%', 1, 6], ['tp', '3P%', 1, 2.5]];
    return `<h1>${t.leaderTitle}</h1><p class="dim" style="margin:-10px 0 0">${t.minGp}</p><div class="grid3">${cats.map(([k, n, pm, min]) => panel(ab(n), leadList(leaders(k, 10, min), pm))).join('')}</div>`;
  }
  function vHistory() {
    const D = ST.D, t = T();
    const ch = (D.champs || []).map(c => `<tr><td class="num">${c.s}</td><td class="l">${teamBy(c.code) ? tlink(teamBy(c.code)) : esc(c.c)}</td><td class="l dim">${esc(c.mvp)}</td></tr>`).join('');
    const hof = (D.hof || []).map(h => `<tr><td class="num">${h.s}</td><td class="l"><b>${esc(h.n)}</b> <span class="dim">${esc(h.pos)}</span></td><td class="l">${team(h.t) ? tlink(team(h.t)) : ''}</td><td class="num">${h.no != null ? '#' + h.no : ''}</td><td class="l dim">${esc(h.line)}</td></tr>`).join('');
    const ret = D.teams.flatMap(x => (x.ret || []).map(r => `<tr><td class="l">${tlink(x)}</td><td class="num">#${r.no}</td><td class="l">${esc(r.n)}</td></tr>`)).join('');
    const x3 = (D.x3 || []).map(x => `<tr><td class="num">${x.s}</td><td class="l">${teamBy(x.c) ? tlink(teamBy(x.c)) : esc(x.c)}</td><td class="l dim">MVP ${esc(x.mvp)}</td></tr>`).join('');
    const fans = (D.fanTop || []).map((f, i) => `<div class="lead"><span class="r">${i + 1}</span><span>${esc(f.n)} <small>${esc(f.c)}</small></span><b>${f.p}</b></div>`).join('');
    const tb = (head, body) => body ? `<div class="scroll"><table><tbody>${body}</tbody></table></div>` : `<p class="empty">${t.noData}</p>`;
    return `<h1>${t.history}</h1><div class="grid2">${panel(t.champs, tb('', ch))}${panel(t.hof, tb('', hof))}</div><div class="grid3">${panel(t.retired, tb('', ret))}${panel(t.x3, tb('', x3))}${panel(t.fanTop, fans || `<p class="empty">${t.noData}</p>`)}</div>`;
  }
  function vJoin() {
    const t = T();
    return `<h1>${t.joinTitle}</h1><p class="dim" style="margin:-8px 0 0;max-width:65ch">${t.joinLead}</p>${panel('CHAT', `<div class="cmds">${t.cmds.map(([c, d]) => `<div class="cmd"><code>${esc(c)}</code><span>${esc(d)}</span></div>`).join('')}</div>`)}
      <p><a class="live" href="https://www.youtube.com/@PickupIsland247/live" target="_blank" rel="noopener">${t.live}</a></p>`;
  }
  const tip = $('tip');
  const showTip = (el) => { tip.innerHTML = `<b>${esc(el.dataset.tk || '')}</b>${esc(el.dataset.tip)}`; tip.hidden = false;
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), innerWidth - tw - 8), y = r.top - th - 8; if (y < 8) y = r.bottom + 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px'; };
  const hideTip = () => { tip.hidden = true; };
  document.addEventListener('mouseover', (e) => { const el = e.target.closest('abbr[data-tip]'); if (el) showTip(el); else hideTip(); });
  document.addEventListener('focusin', (e) => { const el = e.target.closest('abbr[data-tip]'); if (el) showTip(el); });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('click', (e) => { const el = e.target.closest('abbr[data-tip]'); if (el) { e.stopPropagation(); showTip(el); } else hideTip(); }, true);
  addEventListener('scroll', hideTip, { passive: true });
  async function boot() {
    try { await load(); } catch (e) { ST.D = null; }
    render();
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', async () => { ST.lang = b.dataset.lang; try { localStorage.setItem('pil-db-lang', ST.lang); } catch (e) {} await boot(); }));
  addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
  setInterval(async () => { const prev = ST.D && ST.D.at; ST.loaded = ''; ST.base = null; try { await load(); } catch (e) {} if (ST.D && ST.D.at !== prev && !document.activeElement.matches('input,select')) render(); else chrome(); }, 120000);
  boot();
})();
</script>

</body>
